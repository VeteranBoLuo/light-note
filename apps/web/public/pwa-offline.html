<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 与主页面同口径:应用界面不做整页缩放(见 index.html 里的说明) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#615ced" />
    <title>轻笺 · 暂时离线</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #090a12;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        color: #f6f5ff;
        background: radial-gradient(circle at 50% 12%, rgba(97, 92, 237, 0.24), transparent 35%), #090a12;
      }

      main {
        width: min(440px, 100%);
        padding: 38px 30px;
        border: 1px solid rgba(151, 147, 255, 0.18);
        border-radius: 24px;
        background: rgba(17, 18, 31, 0.88);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 16px 38px rgba(97, 92, 237, 0.28);
      }

      h1 {
        margin: 22px 0 10px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #9698aa;
        font-size: 14px;
        line-height: 1.75;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png?v=7" alt="轻笺" />
      <h1>网络暂时不可用</h1>
      <p>轻笺会在网络恢复后继续工作，请检查网络连接并重新打开或刷新页面。</p>
    </main>
  </body>
</html>
