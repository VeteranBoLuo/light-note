<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>照片测试 · 本地抠图</title>
  <link rel="stylesheet" href="./editor.css">
  <style>
    .results-head { align-items: flex-end; }
    .results-head .primary { text-decoration: none; }
    .results { display: grid; gap: 14px; }
    .case { padding: 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .case header { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
    .case h2 { font-size: 17px; }
    .case p { color: var(--muted); line-height: 1.55; margin: 0 0 12px; }
    .case .case-note { margin-top: 10px; margin-bottom: 0; font-size: 12px; }
    .comparison { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
    .comparison.pair { grid-template-columns: repeat(2,minmax(0,1fr)); }
    figure { margin: 0; min-width: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .test-photo { width: 100%; height: clamp(165px, 32vw, 310px); display: block; object-fit: contain; }
    .test-photo.cutout { background-color: #fafafe; background-image: conic-gradient(#e9eaf3 25%, #fafafe 0 50%, #e9eaf3 0 75%, #fafafe 0); background-size: 18px 18px; }
    .test-photo.original { background: var(--canvas); }
    figcaption { padding: 7px 8px; display: flex; justify-content: space-between; align-items: start; gap: 4px; color: var(--muted); font-size: 12px; }
    figcaption a { flex: none; }
    .details { margin-top: 10px; }
    .details summary { padding: 4px 0; color: var(--accent); cursor: pointer; font-size: 12px; }
    .details[open] > .comparison { margin-top: 6px; }
    .credits { font-size: 12px; }
    @media (max-width: 600px) {
      .case { padding: 10px; }
      .case header { align-items: flex-start; }
      .comparison { gap: 4px; }
      .test-photo { height: clamp(112px, 38vw, 220px); }
      figcaption { flex-wrap: wrap; }
    }
    @media (prefers-color-scheme: dark) {
      .test-photo.cutout { background-color: #34364b; background-image: conic-gradient(#2b2d42 25%, #34364b 0 50%, #2b2d42 0 75%, #34364b 0); }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-head results-head">
      <div class="title-group">
        <div class="brand-icon" aria-hidden="true"><i></i></div>
        <div><div class="section-name">本地抠图</div><h1>真实照片效果对照</h1></div>
      </div>
      <a href="./" class="primary">返回抠图工作区</a>
    </header>
    <div class="results" id="results"></div>
  </main>
  <script type="module">
    const notes = {
      wind: {
        overall: '风吹起的几束头发能留下，顶端极细的发丝有断点。边缘浅色像素在深色背景上更显眼。',
        edit: '用小号笔刷沿原图补回一段断开的碎发。发丝越细，补边时越容易夹带少量天空。',
      },
      curls: {
        overall: '相近的深色卷发与树木边缘会粘连，挡在脸前的绿叶也被当成了主体。',
        edit: '擦除头发外侧明显伸出的叶片。被叶子遮住的位置在原图没有可用头发像素。',
      },
      street: {
        overall: '栏杆和街景大部分被分开，贴着左侧发梢的橙色灯点随头发保留了一小段。',
        edit: '用窄笔刷擦掉边缘的亮点，继续检查贴着头发的其他灯光。',
      },
      leaves: {
        overall: '深色卷发、脸和肩膀与绿叶分离得较干净。细卷发之间的小空隙仍有粘连。',
      },
    };
    const node = (tag,text='') => {
      const element = document.createElement(tag);
      element.textContent = text;
      return element;
    };
    function addFigure(container, label, url, original, downloadable = true) {
      const figure = node('figure');
      const image = new Image();
      image.src = url;
      image.alt = label;
      image.loading = 'lazy';
      image.className = 'test-photo ' + (original ? 'original' : 'cutout');
      const caption = node('figcaption');
      caption.append(node('span',label));
      if (!original && downloadable) {
        const save = node('a','PNG');
        save.href = url;
        save.download = '';
        save.setAttribute('aria-label','下载' + label + ' PNG');
        caption.append(save);
      }
      figure.append(image,caption);
      container.append(figure);
    }
    const samples = await fetch('./samples/sources.json').then((response)=>response.json());
    for (const sample of samples) {
      const entry = notes[sample.id];
      if (!entry) continue;
      const card = node('article');
      card.className = 'case';
      const header = node('header');
      const rerun = node('a','试这张照片 ↗');
      rerun.href = './?sample=' + encodeURIComponent(sample.id);
      header.append(node('h2',sample.label),rerun);
      const compare = node('div');
      compare.className = entry.edit ? 'comparison' : 'comparison pair';
      addFigure(compare,'原图',sample.file,true);
      addFigure(compare,'点选后','./local-assets/examples/'+sample.id+'-auto.png',false);
      if (entry.edit) addFigure(compare,'笔刷修整','./local-assets/examples/'+sample.id+'-brush.png',false);
      card.append(header,node('p',entry.overall),compare);
      if (entry.edit) {
        const details = node('p',entry.edit);
        details.className = 'case-note';
        card.append(details);
      }
      if (sample.id === 'wind' || sample.id === 'curls') {
        const details = node('details');
        details.className = 'details';
        const closeups = node('div');
        closeups.className = 'comparison';
        const base = './local-assets/examples/' + sample.id + '-detail-';
        addFigure(closeups,'原图局部',base + 'original.png',true,false);
        addFigure(closeups,'点选后局部',base + 'auto.png',false,false);
        addFigure(closeups,'修整后局部',base + 'brush.png',false,false);
        details.append(node('summary','放大看发丝与边缘'),closeups);
        card.append(details);
      }
      const credits = node('p','照片来源 ');
      credits.className = 'case-note credits';
      const link = node('a',sample.credit+' / Unsplash');
      link.href = sample.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      credits.append(link);
      card.append(credits);
      document.querySelector('#results').append(card);
    }
  </script>
</body>
</html>
