<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>移除人物并补全 · 实拍试验</title>
  <link rel="stylesheet" href="../editor.css">
  <link rel="stylesheet" href="./comparison.css">
</head>
<body>
  <main class="removal-lab">
    <header class="page-head">
      <div class="title-group">
        <div class="brand-icon" aria-hidden="true"><i></i></div>
        <div><div class="section-name">知识工坊 / 本地图片试验</div><h1>移除人物并补全</h1></div>
      </div>
      <a class="secondary return" href="../?sample=bridge">打开抠图与补全工作台</a>
    </header>
    <nav class="scene-list" aria-label="测试照片" id="scenes"></nav>

    <section class="trial-layout">
      <div class="trial-board">
        <header class="trial-toolbar">
          <h2 id="scene-title"></h2>
          <div class="backgrounds mode-tabs" role="group" aria-label="照片查看方式">
            <button id="compare-tab" type="button" aria-pressed="true">前后对比</button>
            <button id="mask-tab" type="button" aria-pressed="false">查看选区</button>
          </div>
        </header>
        <div class="trial-stage">
          <div id="split-frame" class="split-frame">
            <img id="after-image" alt="修复后的照片">
            <img id="before-image" alt="原始照片">
            <div id="split-line" class="split-line" aria-hidden="true"><span>‹ ›</span></div>
            <div class="image-label before-label" id="before-label">原图</div>
            <div class="image-label after-label" id="after-label">修复后</div>
            <img id="mask-image" alt="粉色区域为参与修复的选区" hidden>
          </div>
        </div>
        <div class="trial-slider">
          <label for="position">对比分隔线</label>
          <input type="range" id="position" min="0" max="100" value="50" aria-label="前后对比分隔线">
          <a id="download" download>下载结果 PNG</a>
        </div>
      </div>
      <aside class="scene-notes" aria-label="效果说明">
        <h2 id="notes-title">效果观察</h2>
        <p id="notes"></p>
        <div id="choices" class="choices" role="group" aria-label="选区方式" hidden>
          <button id="auto" type="button" class="secondary" aria-pressed="false">直接点选</button>
          <button id="corrected" type="button" class="secondary" aria-pressed="true">修正选区</button>
        </div>
        <dl>
          <div><dt>补全范围</dt><dd id="selection-notes"></dd></div>
          <div><dt>模型推理</dt><dd id="inference"></dd></div>
          <div><dt>照片来源</dt><dd><a id="credits" target="_blank" rel="noopener noreferrer"></a></dd></div>
        </dl>
      </aside>
    </section>
  </main>
  <script type="module" src="./comparison.js"></script>
</body>
</html>
