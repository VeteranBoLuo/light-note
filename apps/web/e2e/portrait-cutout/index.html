<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>本地抠图 · 轻笺原型</title>
  <link rel="stylesheet" href="./editor.css">
</head>
<body>
  <main>
    <header class="page-head">
      <div class="title-group">
        <div class="brand-icon" aria-hidden="true"><i></i></div>
        <div>
          <div class="section-name">知识工坊 / 图片处理</div>
          <h1>本地抠图</h1>
        </div>
      </div>
      <span class="local"><i aria-hidden="true"></i>图片仅在本机处理</span>
    </header>

    <section class="editor cutout-editor" aria-label="本地抠图工作区">
      <div class="file-bar">
        <div class="file-info">
          <img id="file-thumbnail" alt="" hidden>
          <div><strong id="file-name">选择一张图片</strong><small id="file-size"></small></div>
        </div>
        <div class="file-actions">
          <button id="upload" type="button" class="secondary">更换图片</button>
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <div class="mode-group output-modes" role="group" aria-label="输出方式">
            <button type="button" class="output-mode" data-output="keep" aria-pressed="true">保留主体</button>
            <button type="button" class="output-mode" data-output="remove" aria-pressed="false">移除并补全</button>
          </div>
          <button id="download" type="button" class="primary" disabled><span class="download-icon" aria-hidden="true"></span><span id="action-label">导出透明 PNG</span></button>
        </div>
      </div>

      <div class="toolbar" aria-label="抠图工具">
        <div class="mode-group" role="group" aria-label="选择编辑工具">
          <button class="mode" data-mode="pick" type="button" aria-pressed="true"><span aria-hidden="true" class="tool-icon">⌖</span>点选主体</button>
          <button class="mode" data-mode="add" type="button" aria-pressed="false" disabled><span aria-hidden="true" class="tool-icon">＋</span>补选</button>
          <button class="mode" data-mode="erase" type="button" aria-pressed="false" disabled><span aria-hidden="true" class="tool-icon">−</span>擦除</button>
        </div>
        <label class="brush" for="brush-size">笔刷
          <input id="brush-size" type="range" min="4" max="72" value="20" disabled>
          <output for="brush-size" id="brush-value">20 px</output>
        </label>
        <button id="undo" class="quiet" type="button" disabled title="撤销上一次笔刷操作">↶ <span>撤销</span></button>
        <div class="zoom" role="group" aria-label="画布缩放">
          <button id="zoom-out" type="button" aria-label="缩小" disabled>−</button>
          <button id="zoom-fit" type="button" title="适合窗口">适合窗口</button>
          <button id="zoom-in" type="button" aria-label="放大">＋</button>
        </div>
      </div>

      <div class="panes">
        <section class="pane" aria-labelledby="original-title">
          <div class="pane-head"><h2 id="original-title">原图与选区</h2><span class="pane-hint" id="canvas-hint">点击要处理的主体</span></div>
          <div id="original-stage" class="stage">
            <div class="frame" id="source-frame" hidden>
              <canvas id="source" tabindex="0" aria-label="原图，点击可选中主体。也可用方向键移动选点，按回车识别。"></canvas>
              <canvas id="outline" aria-hidden="true"></canvas>
              <span id="point" aria-hidden="true" hidden></span>
              <span id="brush-cursor" aria-hidden="true" hidden></span>
            </div>
            <p class="stage-empty" id="source-empty">从下方选一张示例照片，或打开自己的图片。</p>
          </div>
        </section>
        <section class="pane" aria-labelledby="preview-title">
          <div class="pane-head">
            <h2 id="preview-title">抠图预览</h2>
            <div class="backgrounds" id="preview-backgrounds" role="group" aria-label="预览底色">
              <button data-background="checker" type="button" aria-pressed="true">透明</button>
              <button data-background="white" type="button" aria-pressed="false">白底</button>
              <button data-background="dark" type="button" aria-pressed="false">深底</button>
            </div>
          </div>
          <div id="preview-stage" class="stage preview-stage" data-background="checker">
            <div class="frame" id="preview-frame" hidden><canvas id="result" aria-label="图片处理结果"></canvas></div>
            <p class="stage-empty" id="preview-empty">选中主体后，这里会显示透明背景的效果。</p>
          </div>
        </section>
      </div>

      <div class="status-bar">
        <div id="status" role="status" aria-live="polite">正在打开示例图片…</div>
        <div class="status-actions">
          <span id="timing"></span>
          <button id="cancel-repair" class="quiet" type="button" hidden>取消</button>
        </div>
      </div>
    </section>

    <section class="samples" aria-labelledby="samples-title">
      <div class="samples-head"><h2 id="samples-title">测试照片</h2><div class="sample-links"><a href="./results.html">抠图对照 ↗</a><a href="./removal-test/">移除对照 ↗</a></div></div>
      <div id="samples" class="sample-list"></div>
    </section>
  </main>
  <script src="./editor.js" type="module"></script>
</body>
</html>
