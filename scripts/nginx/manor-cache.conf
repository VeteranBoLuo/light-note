# Include inside the boluo66.top server. Account/API responses never enter this location.
# Use expires (rather than location add_header) to retain inherited HSTS/security headers.
location ^~ /manor/ {
    try_files $uri =404;
    expires -1;

    # Art revisions are immutable. install-web-release.sh rejects changed bytes
    # under an existing revision name; new artwork must receive a new revision.
    location ~* -r[0-9]+(?:-[0-9]+)?\.(webp|png|svg)$ {
        expires 365d;
    }
    location ~ \.(js|css)$ {
        set $manor_cache_expiry -1;
        if ($arg_v ~ "^[a-f0-9]{16}$") {
            set $manor_cache_expiry 365d;
        }
        expires $manor_cache_expiry;
    }
}
