# Include in the boluo66.top HTTPS server for the official 1.0.4 revision.
# Existing App pages can still request the previous package with ?reinstall=....
# Redirect only those explicit reinstall requests; preserve immutable old files.
location ^~ /downloads/android/ {
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;

    set $lightnote_android_download_cache "public, max-age=31536000, immutable";
    set $lightnote_android_reinstall_request "$uri:$arg_reinstall";
    if ($lightnote_android_reinstall_request ~ "^/downloads/android/light-note-1[.]0[.]4(?:-d40ea29a514b)?[.]apk:.+$") {
        set $lightnote_android_download_cache "no-store, no-cache, must-revalidate";
        return 302 https://boluo66.top/downloads/android/light-note-1.0.4-6556d68980f9.apk;
    }

    # Explicit headers retain the HTTPS server's security headers when adding
    # the download cache policy at this location.
    add_header Cache-Control $lightnote_android_download_cache;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Canonical-URL "https://boluo66.top$request_uri" always;
    try_files $uri =404;
}
