# Include in the site's server block. Merge/replace an existing /assets/ location
# instead of declaring it twice. All files in this directory are build-hashed.
# expires preserves inherited security headers (location add_header would not).
location ^~ /assets/ {
    try_files $uri =404;
    expires 365d;
}

# A stale or missing manifest must never become a successful SPA HTML response.
location = /static-prewarm.json {
    try_files $uri =404;
    expires -1;
}
