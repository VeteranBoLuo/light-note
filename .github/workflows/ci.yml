name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql:
    name: MySQL 5.7 核心行为
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIGHTNOTE_TEST_MYSQL_SOCKET: /tmp/light-note-ci-mysql/mysql.sock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 启动独立 MySQL 5.7（无网络监听与生产凭据）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 777 /tmp/light-note-ci-mysql
          docker run -d --name light-note-ci-mysql --network none \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -v /tmp/light-note-ci-mysql:/tmp/light-note-ci-mysql \
            mysql:5.7.44 \
            --skip-networking --socket=/tmp/light-note-ci-mysql/mysql.sock \
            --default-time-zone=+08:00 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for attempt in $(seq 1 90); do
            if docker logs light-note-ci-mysql 2>&1 | grep 'MySQL init process done' >/dev/null && \
              docker exec light-note-ci-mysql mysqladmin \
                --socket=/tmp/light-note-ci-mysql/mysql.sock -uroot ping --silent; then
              exit 0
            fi
            sleep 2
          done
          docker logs light-note-ci-mysql
          exit 1
      - name: 笔记持久化、上传并发、排序与运营 SQL
        run: pnpm --filter server test:mysql
      - name: 清理临时数据库
        if: always()
        run: docker rm -fv light-note-ci-mysql || true

  quality:
    name: 类型检查、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CI 只使用无权限占位配置，避免测试导入模块时连接生产数据库或真实 OBS。
    env:
      TZ: Asia/Shanghai
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: light_note_ci
      OBS_AK: ci-placeholder
      OBS_SK: ci-placeholder
      OBS_ENDPOINT: https://obs.example.invalid
      OBS_BUCKET_NAME: light-note-ci
    steps:
      - name: 读取仓库内容
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装真实图片转换测试运行时
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - name: 类型检查
        run: pnpm typecheck

      - name: 运行测试
        run: pnpm test

      - name: 校验 AI 模型访问边界
        run: pnpm --filter server check:ai-model-access

      - name: 构建前端
        run: pnpm build:web
        env:
          SKIP_PRERENDER: "1"
