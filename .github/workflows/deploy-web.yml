name: 部署前端到服务器（手动触发）

# 日常部署走本地 scripts/deploy-web.sh（需本机有 ~/.ssh/hermes_server 私钥）。
# 本机没有私钥时，来 Actions 页点「Run workflow」，由 runner 用仓库 Secret 里的私钥部署。
# SSH 连接使用仓库 Secret HOST、USERNAME 和 SSH_PRIVATE_KEY。
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false # 部署不中途取消，避免 scp / 原子切换半途中断

jobs:
  deploy-web:
    # 线上只从 main（已发布版本）部署；develop 是待发版集成分支。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 读取仓库内容
        uses: actions/checkout@v4

      - name: 核对远程 main 和 CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-deploy-release.sh

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: 安装 nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖(workspace)
        run: pnpm install --frozen-lockfile

      - name: 准备 SSH 私钥与 known_hosts
        env:
          DEPLOY_SSH_HOST: ${{ secrets.HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_SSH_HOST"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/hermes_server
          chmod 600 ~/.ssh/hermes_server
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 部署前端(复用 scripts/deploy-web.sh)
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTNOTE_DEPLOY_HOST: ${{ format('{0}@{1}', secrets.USERNAME, secrets.HOST) }}
          LIGHTNOTE_DEPLOY_SSH_KEY: ~/.ssh/hermes_server
        run: pnpm deploy:web
